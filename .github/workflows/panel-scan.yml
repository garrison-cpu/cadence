# Refreshes the Discover panel data on a schedule.
#
# The scan reads each panel.json account's recent posts and rewrites
# breakouts:tiktok. Without it the Discover window pills go stale: every
# breakout carries the post's createTime, and the page filters on age, so once
# the newest post ages past a window that bubble renders empty.
#
# This runs the scan ON THE RUNNER (node scripts/run-panel-scan.js) rather than
# curling the deployed app, so it no longer depends on the app being up or on
# APP_URL/CRON_KEY being correct. It writes straight to Postgres.
#
# Setup (both required):
#   Repo → Settings → Secrets and variables → Actions → Secrets
#     NEON_DATABASE_URL  the Neon connection string (the pooled one is fine)
#     RAPIDAPI_KEY       the TokAPI key
name: panel-scan

on:
  schedule:
    - cron: '0 */4 * * *' # every 4 hours (~6 runs/day, ~306 TokAPI calls/day)
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: panel-scan
  cancel-in-progress: false # a scan takes ~2min; never run two at once

jobs:
  scan:
    runs-on: ubuntu-latest
    # The scan itself is ~2min; the headroom is for TokAPI being slow, not for
    # the job legitimately needing it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run panel scan
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/run-panel-scan.js
